<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:description" content="{{.Kaomoji}}" />
    <meta charset="UTF-8" />
    <title>{{.Kaomoji}} — kaomojiserv</title>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      :root {
        color-scheme: light dark;
        --background: #f5f1e8;
        --foreground: #24211c;
        --button-background: #fffaf0;
        --button-border: #9d9688;
        --button-hover: #ebe4d7;
        --button-hover-border: #5f5a51;
        --muted: #756f65;
        --nav: #696478;
        --nav-hover: #292632;
        --footer: #a39b8e;
        --urgent: #a34f00;
        --success-background: #e0f3df;
        --success-border: #438548;
        --success-foreground: #195c21;
        --failure-background: #f8dfdf;
        --failure-border: #a54b4b;
        --failure-foreground: #7d2020;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #0d0d0d;
          --foreground: #e8e8e8;
          --button-background: #1a1a1a;
          --button-border: #444;
          --button-hover: #2a2a2a;
          --button-hover-border: #888;
          --muted: #777;
          --nav: #667;
          --nav-hover: #aaa;
          --footer: #555;
          --urgent: #cc6600;
          --success-background: #0d2b0d;
          --success-border: #3a8a3a;
          --success-foreground: #7fff7f;
          --failure-background: #2b0d0d;
          --failure-border: #8a3a3a;
          --failure-foreground: #ff9999;
        }
      }
      body {
        background: var(--background);
        color: var(--foreground);
        font-family: 'Courier New', monospace;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
      }
      .kaomoji {
        font-size: clamp(2rem, 8vw, 6rem);
        animation: float 4s ease-in-out infinite;
        cursor: pointer;
        user-select: none;
        text-align: center;
        padding: 1rem;
        line-height: 1.4;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-14px); }
      }
      .copy-btn {
        background: var(--button-background);
        border: 2px solid var(--button-border);
        color: var(--foreground);
        font-family: 'Courier New', monospace;
        font-size: 0.9rem;
        font-weight: bold;
        letter-spacing: 0.15em;
        padding: 0.6rem 2rem;
        cursor: pointer;
        border-radius: 3px;
        transition: all 0.15s ease;
      }
      .copy-btn:hover { background: var(--button-hover); border-color: var(--button-hover-border); transform: scale(1.05); }
      .copy-btn:active { transform: scale(0.97); }
      .copy-btn.copied { background: var(--success-background); border-color: var(--success-border); color: var(--success-foreground); }
      .copy-btn.failed { background: var(--failure-background); border-color: var(--failure-border); color: var(--failure-foreground); }
      .countdown { font-size: 0.75rem; color: var(--muted); letter-spacing: 0.05em; min-height: 1em; }
      .countdown.urgent { color: var(--urgent); animation: pulse 1s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
      .nav {
        font-size: 0.65rem;
        color: var(--muted);
        letter-spacing: 0.05em;
      }
      .nav a { color: var(--nav); text-decoration: none; transition: color 0.1s; }
      .nav a:hover { color: var(--nav-hover); }
      .footer {
        position: fixed;
        bottom: 1rem;
        font-size: 0.65rem;
        color: var(--footer);
        letter-spacing: 0.08em;
        text-align: center;
        user-select: none;
      }
      body.rave { animation: rave-bg 0.8s linear infinite; }
      body.rave .kaomoji { animation: rave-bounce 0.35s ease-in-out infinite alternate, rave-color 0.8s linear infinite; }
      body.rave .footer { color: #fff; text-shadow: 0 0 8px currentColor; }
      .confetti {
        position: fixed;
        top: -2rem;
        pointer-events: none;
        z-index: 10;
        animation: confetti-fall 2.5s linear forwards;
      }
      @keyframes rave-bg {
        0% { background: #180018; }
        33% { background: #001828; }
        66% { background: #182000; }
        100% { background: #180018; }
      }
      @keyframes rave-bounce { to { transform: translateY(-30px) rotate(4deg) scale(1.12); } }
      @keyframes rave-color {
        0% { color: #ff4fd8; text-shadow: 0 0 20px #ff4fd8; }
        50% { color: #4ffff3; text-shadow: 0 0 20px #4ffff3; }
        100% { color: #ffef4f; text-shadow: 0 0 20px #ffef4f; }
      }
      @keyframes confetti-fall { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
    </style>
  </head>
  <body>
    <div
      class="kaomoji"
      id="kaomoji"
      data-kaomoji="{{.Kaomoji}}"
      onclick="copyKaomoji()"
      title="click to yoink"
    >{{.Kaomoji}}</div>

    <button class="copy-btn" id="copyBtn" onclick="copyKaomoji()">YOINK</button>

    <div class="countdown" id="countdown"></div>

    <div class="nav">
      <a href="/raw">/raw</a> &middot;
      <a href="/api">/api</a> &middot;
      <a href="/all">/all</a> &middot;
      <a href="/health">/health</a> &middot;
      <a href="/version">/version</a>
    </div>

    <div class="footer" id="footer">✦ certified fresh by the Ministry of Expressiveness ✦</div>

    <script>
      function copyKaomoji() {
        const k = document.getElementById('kaomoji').dataset.kaomoji;
        const btn = document.getElementById('copyBtn');
        navigator.clipboard.writeText(k).then(() => {
          btn.textContent = 'YOINKED ✓';
          btn.classList.add('copied');
          setTimeout(() => { btn.textContent = 'YOINK'; btn.classList.remove('copied'); }, 2000);
        }).catch(() => {
          btn.textContent = '(╥﹏╥) needs HTTPS';
          btn.classList.add('failed');
          setTimeout(() => { btn.textContent = 'YOINK'; btn.classList.remove('failed'); }, 2500);
        });
      }

      const konami = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
      let konamiIndex = 0;
      let footerClicks = 0;

      function startRave() {
        if (document.body.classList.contains('rave')) return;
        const footer = document.getElementById('footer');
        const originalFooter = footer.textContent;
        document.body.classList.add('rave');
        footer.textContent = '✦ EXPRESSIVENESS OVERLOAD ✦';

        const confettiTimer = setInterval(() => {
          const piece = document.createElement('span');
          piece.className = 'confetti';
          piece.textContent = ['☆', '♡', 'ツ'][Math.floor(Math.random() * 3)];
          piece.style.left = Math.random() * 100 + 'vw';
          piece.style.color = `hsl(${Math.random() * 360} 100% 70%)`;
          piece.style.fontSize = 0.8 + Math.random() * 1.4 + 'rem';
          document.body.appendChild(piece);
          setTimeout(() => piece.remove(), 2500);
        }, 100);

        setTimeout(() => {
          clearInterval(confettiTimer);
          document.body.classList.remove('rave');
          footer.textContent = originalFooter;
        }, 10000);
      }

      document.addEventListener('keydown', event => {
        const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
        konamiIndex = key === konami[konamiIndex] ? konamiIndex + 1 : (key === konami[0] ? 1 : 0);
        if (konamiIndex === konami.length) {
          konamiIndex = 0;
          startRave();
        }
      });

      document.getElementById('footer').addEventListener('click', () => {
        footerClicks++;
        if (footerClicks === 7) {
          footerClicks = 0;
          startRave();
        }
      });

      let seconds = {{.RemainingSeconds}};
      const el = document.getElementById('countdown');
      (function tick() {
        if (seconds <= 0) {
          el.textContent = 'new kaomoji incoming (ﾟヮﾟ)';
          el.classList.add('urgent');
          setTimeout(() => location.reload(), 500);
          return;
        }
        el.textContent = seconds === 1 ? 'rotating in 1s' : 'rotating in ' + seconds + 's';
        if (seconds <= 5) el.classList.add('urgent');
        seconds--;
        setTimeout(tick, 1000);
      })();
    </script>
  </body>
</html>
